<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untukmu...</title>
    <link rel="stylesheet" href="nanda.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="login-container" id="loginContainer">
            <h1>Selamat Datang!</h1>
            <p>HAIII SAYANGG MASUKANN NAMAMU BABYY:</p>
            <form id="loginForm">
                <input type="text" id="userNameInput" placeholder="Nama Anda" required>
                <button type="submit">Masuk</button>
            </form>
        </div>

        <div class="container poem-container" id="poemContainer">
            <h2 id="greetingMessage"></h2>
            <div class="poem-box">
                <pre id="poem"></pre>
            </div>
            <button id="restartButton" style="display: none;">Ulangi Puisi</button>
        </div>
    </div>
    <script src="nanda.js"></script>
</body>
</html>
